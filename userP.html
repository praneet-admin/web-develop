<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile Card</title>

  <style>

    /* PAGE BACKGROUND */
    body {
      background-color: #f0f4ff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* THE CARD */
    .card {
      background-color: white;
      width: 320px;
      padding: 30px;          /* space INSIDE the card */
      border: 2px solid #4a90e2; /* line AROUND the card */
      border-radius: 16px;
      margin: auto;           /* centres the card */
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }

    /* PROFILE PHOTO */
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;     /* makes it a circle */
      border: 3px solid #4a90e2;
      margin-bottom: 16px;    /* space BELOW photo */
    }

    /* NAME */
    h1 {
      font-size: 22px;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    /* JOB TITLE */
    .role {
      font-size: 14px;
      color: #4a90e2;
      font-weight: bold;
      margin-bottom: 14px;
      margin-top: 6px;
    }

    /* LINE SEPARATOR */
    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin-bottom: 14px;
    }

    /* BIO TEXT */
    .bio {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* CONTACT DETAILS */
    .contact {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    /* SKILL TAGS */
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tag {
      background-color: #e8f0fe;
      color: #4a90e2;
      padding: 5px 12px;      /* space INSIDE each tag */
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid #c0d4f8;
    }

    /* CONTACT BUTTON */
    .btn {
      display: inline-block;
      background-color: #4a90e2;
      color: white;
      padding: 10px 28px;     /* space INSIDE button */
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .btn:hover {
      background-color: #357abd;
    }

  </style>
</head>
<body>

  <div class="card">

    <!-- ✏️ CHANGE: Replace the src URL with your own photo link -->
    <img
      src="praneet zoho.jpeg"
      alt="My Photo"
      class="avatar"
    />

    <!-- ✏️ CHANGE: Your name -->
    <h1>Praneet</h1>

    <!-- ✏️ CHANGE: Your role or what you do -->
    <p class="role">Student</p>

    <hr />

    <!-- ✏️ CHANGE: A short note about yourself -->
    <p class="bio">
      Hi! I'm praneet. I enjoy building things
      for the web and exploring how design works.
    </p>

    <!-- ✏️ CHANGE: Your skills -->
    <div class="tags">
      <span class="tag">HTML</span>
      <span class="tag">CSS</span>
      <span class="tag">WEB DESIGNING</span>
    </div>

    <!-- ✏️ CHANGE: Replace # with your email like mailto:you@email.com -->
   <p class="contact">
  <strong>Email</strong>: <a href="mailto:praneet7770@gmail.com">praneet7770@gmail.com</a><br /> 
  <strong>Phone</strong>: +91 72000 85151<br />
  <a href="https://github.com/praneet-admin" class="btn">GitHub</a>

</p>
   
   

  </div>

</body>
</html>
